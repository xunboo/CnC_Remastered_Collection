; Copy this file to llm.ini and fill authorization with the complete header.
; llm.ini is local-only and ignored by Git. Do not paste the token into chat.
[bridge]
; Place llm.ini and LLMBridge.exe beside the mod's RedAlert.dll.
; Normal Steam / Red Alert launch needs no environment variables or scripts.
enabled = true
auto_start = true
channel = v1
; -1 selects the first eligible computer-controlled army.
house = -1
; real sends API requests; mock exercises control offline using hold plans.
mode = real

[llm]
protocol = chat_completions
api_url = https://api.cline.bot/api/v1/chat/completions
authorization =
model = cline-free/deepseek-v4.1-flash
reasoning_effort = low
; Some compatible providers do not implement strict schema generation.
; Local JSON/wire/game validation is always enabled regardless of this flag.
strict = false
; Use auto for providers such as Muse that reject forced/required tool choice.
; Only a real, valid submit_tactical_plan call is accepted in every mode.
tool_choice = forced
parallel_tool_calls = false
max_output_tokens = 4096
; Maximum network wait in wall-clock seconds, independent of simulation speed.
timeout = 60
; Maximum plan lifetime after DLL acceptance, in simulation seconds (1-30).
plan_ttl_seconds = 30
interval = 8

[headers]
User-Agent = Cline/3.72.0
HTTP-Referer = https://cline.bot
X-Title = Cline
X-CLIENT-TYPE = vscode
X-CLIENT-VERSION = 3.72.0
X-PLATFORM = vscode
X-PLATFORM-VERSION = 1.90.0
X-CORE-VERSION = 3.72.0
X-IS-MULTIROOT = false
